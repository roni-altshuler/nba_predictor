name: Weekly Benchmark

# Re-derives the measured state that every claim on the site rests on.
#
# Weekly rather than daily because a walk-forward over 29,653 games does not
# move meaningfully in 24 hours, and because the numbers quoted in CLAUDE.md
# should change on a schedule someone can notice rather than continuously.

on:
  schedule:
    - cron: '0 13 * * 1'   # Mondays, after the weekend's games are settled
  workflow_dispatch:

concurrency:
  group: weekly-benchmark
  cancel-in-progress: false

permissions:
  contents: write
  # The failure step opens or comments on an issue.
  issues: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore the warehouse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download warehouse-latest \
            --pattern 'warehouse.sqlite.gz' --dir /tmp --clobber
          gunzip -f /tmp/warehouse.sqlite.gz
          mv /tmp/warehouse.sqlite backend/data/warehouse.sqlite

      - name: Integrity check
        run: python -m backend.scripts.validate_warehouse_integrity

      - name: Market benchmark
        run: python -m backend.scripts.benchmark_market

      - name: Elo sweep
        run: python -m backend.scripts.tune_elo

      - name: Playoff series backtest
        run: python -m backend.scripts.benchmark_series

      - name: Rebuild the full historical archive
        # Also republishes the cross-season upset boards, which rank every
        # retrodiction against every other and therefore move whenever the
        # model does.
        # Every season, including the retrodicted forecasts — those DO move
        # when the model changes, so a weekly full rebuild keeps the archive
        # consistent with the model currently serving.
        run: python -m backend.scripts.build_history

      - name: Commit refreshed diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/diagnostics/ backend/data/history/ || true
          if git diff --cached --quiet -I'"generated_at":'; then
            echo "diagnostics unchanged"
          else
            git commit -m "chore: refresh benchmarks [automated]"
            git pull --rebase --autostash origin main || true
            git push
          fi

      - name: Open an issue if this run failed
        # **The live record depends on this job running before each tip-off.**
        # A forecast that was never published cannot be scored as one later,
        # and neither can an injury observation that was never taken — both
        # are permanently lost, not merely late. Until now a failure here was
        # silent: the site kept serving yesterday's artifacts and looked
        # entirely correct.
        #
        # One open issue at a time, reused rather than reopened, so a week of
        # failures is one thread instead of seven notifications nobody reads.
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Weekly benchmark failed"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
            --json number --jq '.[0].number' || true)
          BODY="Run failed: $RUN_URL

          The measured numbers on /accuracy are now older than they claim to be. Nothing is lost permanently — this job is a recomputation — but the site is quoting a stale benchmark until it runs."
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label automated || \
              gh issue create --title "$TITLE" --body "$BODY"
          fi
