name: CI

# Frontend and backend validation for every PR and push to main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # CI installs into a bare 3.12 and calls plain `python -m ...`. A script
      # that only works under a named venv is a script CI cannot run.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest backend/tests/ -q

  frontend:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Vercel escalates ESLint warnings to errors, so this gate has to match
      # what the deploy will do. `npm run build` alone is not enough.
      - name: Lint
        run: npx next lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
